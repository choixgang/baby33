<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>최이든의 특별한 순간들</title>
<meta name="description" content="우리 아기의 탄생과 성장을 기록하는 페이지" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍼</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="floaters" aria-hidden="true">
  <span class="floater heart" style="--x:8%; --delay:0s; --dur:14s; --size:28px;">♥</span>
  <span class="floater bubble" style="--x:20%; --delay:3s; --dur:18s; --size:36px;"></span>
  <span class="floater heart" style="--x:35%; --delay:6s; --dur:16s; --size:20px;">♥</span>
  <span class="floater bubble" style="--x:52%; --delay:1s; --dur:20s; --size:24px;"></span>
  <span class="floater heart" style="--x:68%; --delay:8s; --dur:15s; --size:32px;">♥</span>
  <span class="floater bubble" style="--x:80%; --delay:4s; --dur:19s; --size:44px;"></span>
  <span class="floater heart" style="--x:90%; --delay:10s; --dur:17s; --size:22px;">♥</span>
  <span class="floater bubble" style="--x:60%; --delay:12s; --dur:22s; --size:16px;"></span>
</div>

<header class="hero">
  <p class="eyebrow">Welcome to the world</p>
  <h1 id="babyName" class="hero-name">최이든</h1>
  <p class="hero-sub" id="heroSub">2026년 8월 1일, 우리 곁으로 온 날</p>
  <div class="dday-badge" id="ddayBadge">D+0</div>
</header>

<main>
  <section class="card profile-card" id="profile">
    <div class="profile-photo" id="profilePhoto" aria-hidden="true">🍼</div>
    <h2 class="section-title">출생 프로필</h2>
    <dl class="profile-grid" id="profileGrid">
      <!-- JS로 채워집니다 -->
    </dl>
  </section>

  <section class="card gallery-card" id="growth">
    <h2 class="section-title">성장 기록</h2>
    <p class="section-sub">한 달 한 달, 자라나는 순간들을 담아요</p>
    <div class="gallery-grid" id="galleryGrid">
      <!-- JS로 채워집니다 -->
    </div>
  </section>
</main>

<footer class="site-footer">
  <p>made with <span class="footer-heart">♥</span> for <span id="footerName">최이든</span></p>
</footer>

<script src="script.js"></script>
</body>
</html>
